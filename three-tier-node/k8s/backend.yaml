apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Replace this with your dockerhub image, e.g., yourusername/student-backend:latest
        image: backend-image:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: "mysql"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "admin123"
        - name: DB_NAME
          value: "schooldb"
        - name: REDIS_URL
          value: "redis://redis:6379"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  # Name must be exactly "backend" to match what the Nginx proxy expects in frontend config
  selector:
    app: backend
  ports:
  - port: 3000
